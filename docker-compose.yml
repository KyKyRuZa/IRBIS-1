services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irbis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: irbis
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:5000/api/sites\").then(()=>process.exit(0)).catch(()=>process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
