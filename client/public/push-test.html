<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRBIS Push Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 20px; margin: 10px 0; border-radius: 8px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .status { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>IRBIS Push-уведомления — тест</h1>

  <div class="card">
    <h2>1. Авторизация</h2>
    <input type="text" id="username" placeholder="Логин" value="testadmin" />
    <input type="password" id="password" placeholder="Пароль" value="admin123" />
    <button onclick="login()">Войти</button>
    <div id="loginStatus" class="status">Не авторизован</div>
  </div>

  <div class="card">
    <h2>2. Подписка на push</h2>
    <button onclick="subscribe()" id="subscribeBtn" disabled>Включить уведомления</button>
    <button onclick="unsubscribe()" id="unsubscribeBtn" disabled>Отключить уведомления</button>
    <div id="pushStatus" class="status">Требуется авторизация</div>
  </div>

  <div class="card">
    <h2>3. Отправка тестовых уведомлений</h2>
    <button onclick="sendToAll()" id="sendAllBtn" disabled>Отправить всем</button>
    <button onclick="sendToMe()" id="sendMeBtn" disabled>Отправить мне</button>
    <div id="sendStatus" class="status">Требуется подписка</div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    let token = localStorage.getItem('token') || '';
    let subscription = null;

    function updateLoginStatus(msg, isError = false) {
      document.getElementById('loginStatus').textContent = msg;
      document.getElementById('loginStatus').style.background = isError ? '#ffebee' : '#e8f5e9';
    }

    function updatePushStatus(msg) {
      document.getElementById('pushStatus').textContent = msg;
    }

    function updateSendStatus(msg, isError = false) {
      document.getElementById('sendStatus').textContent = msg;
      document.getElementById('sendStatus').style.background = isError ? '#ffebee' : '#e8f5e9';
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          localStorage.setItem('token', token);
          updateLoginStatus(`Авторизован: ${data.username} (${data.role})`);
          checkSubscription();
        } else {
          updateLoginStatus(data.error || 'Ошибка', true);
        }
      } catch (e) {
        updateLoginStatus('Ошибка сети', true);
      }
    }

    async function checkSubscription() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/push/vapid-public-key`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          updatePushStatus('VAPID ключ получен. Можно подписываться.');
          document.getElementById('subscribeBtn').disabled = false;
          document.getElementById('sendAllBtn').disabled = false;
        }
      } catch (e) {
        updatePushStatus('Ошибка получения VAPID ключа', true);
      }
    }

    async function subscribe() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        updatePushStatus('Push не поддерживается браузером', true);
        return;
      }
      try {
        updatePushStatus('Получение VAPID ключа...');
        const res = await fetch(`${API_BASE}/push/vapid-public-key`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const vapidKey = data.publicKey;
        if (!vapidKey) throw new Error('VAPID ключ пуст');

        updatePushStatus('Регистрация Service Worker...');
        const registration = await navigator.serviceWorker.ready;
        updatePushStatus('Запрос подписки PushManager...');
        const sub = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: vapidKey
        });

        const json = sub.toJSON();
        updatePushStatus(`Подписка получена, endpoint: ${json.endpoint.substring(0, 50)}...`);
        
        const body = {
          endpoint: json.endpoint,
          keys: { p256dh: json.keys.p256dh, auth: json.keys.auth },
          employee_id: null
        };

        updatePushStatus('Сохранение подписки на сервер...');
        const subRes = await fetch(`${API_BASE}/push/subscribe`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!subRes.ok) {
          const err = await subRes.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${subRes.status}`);
        }

        subscription = sub;
        updatePushStatus('Подписка оформлена');
        document.getElementById('subscribeBtn').disabled = true;
        document.getElementById('unsubscribeBtn').disabled = false;
        document.getElementById('sendMeBtn').disabled = false;
      } catch (e) {
        updatePushStatus('Ошибка подписки: ' + e.message, true);
        console.error('Subscribe error:', e);
      }
    }

    async function unsubscribe() {
      try {
        const registration = await navigator.serviceWorker.ready;
        const sub = await registration.pushManager.getSubscription();
        if (sub) {
          await fetch(`${API_BASE}/push/unsubscribe`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ endpoint: sub.endpoint })
          });
          await sub.unsubscribe();
        }
        subscription = null;
        updatePushStatus('Подписка отменена');
        document.getElementById('subscribeBtn').disabled = false;
        document.getElementById('unsubscribeBtn').disabled = true;
        document.getElementById('sendMeBtn').disabled = true;
      } catch (e) {
        updatePushStatus('Ошибка отписки: ' + e.message, true);
      }
    }

    async function sendToAll() {
      try {
        const res = await fetch(`${API_BASE}/push/send-all`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({})
        });
        const data = await res.json();
        updateSendStatus(data.message || data.error, !!data.error);
      } catch (e) {
        updateSendStatus('Ошибка отправки', true);
      }
    }

    async function sendToMe() {
      if (!subscription) {
        updateSendStatus('Сначала оформите подписку', true);
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/push/send`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({})
        });
        const data = await res.json();
        updateSendStatus(data.message || data.error, !!data.error);
      } catch (e) {
        updateSendStatus('Ошибка отправки', true);
      }
    }

    if (token) {
      updateLoginStatus(`Авторизован (токен из localStorage)`);
      checkSubscription();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.error('SW registration failed:', err);
        updatePushStatus('Ошибка регистрации Service Worker: ' + err.message, true);
      });
    }
  </script>
</body>
</html>
