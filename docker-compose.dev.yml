# Development environment: frontend, backend and database run separately
# with published ports and hot reload. No nginx — the Vite dev server
# proxies /api directly to the backend service.
#
# Each service is built from its Dockerfile.dev (deps + Prisma client are
# installed at build time; source + node_modules are bind-mounted for hot
# reload). Rebuild only when package.json / lockfile change:
#   docker compose -f docker-compose.dev.yml up -d --build
#   # run prisma migrations against the dev DB if needed:
#   #   docker compose -f docker-compose.dev.yml exec backend npx prisma migrate deploy
#   Frontend: http://localhost:5173   Backend: http://localhost:5000

name: irbis-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irbis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    # Publish on 5433 to avoid clashing with any Postgres already on host 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=irbis
      - AUTH_TYPE=trust
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.2.6-alpine
    ports:
      - "6380:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npx prisma migrate deploy && node src/scripts/seed.js && node --watch src/index.js"
    environment:
      # Hardcode the in-network service name so we never pick up a host
      # DB_HOST=localhost from the shell environment.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: irbis
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/irbis
      REDIS_URL: redis://redis:6379
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - irbis_uploads_dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # Vite proxies /api (and /certs) to the backend service.
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
    depends_on:
      - backend

volumes:
  pgdata-dev:
  irbis_uploads_dev:
