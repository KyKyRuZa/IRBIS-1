# Development environment: frontend, backend and database run separately
# with published ports and hot reload. No nginx — the Vite dev server
# proxies /api directly to the backend service.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#   # run prisma migrations against the dev DB if needed:
#   #   docker compose -f docker-compose.dev.yml exec backend npx prisma migrate deploy
#   Frontend: http://localhost:5173   Backend: http://localhost:5000

name: irbis-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irbis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Publish on 5433 to avoid clashing with any Postgres already on host 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:24-alpine
    working_dir: /app
    # Install deps, apply migrations, then run with hot reload.
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && node --watch src/index.js"
    environment:
      # Hardcode the in-network service name so we never pick up a host
      # DB_HOST=localhost from the shell environment.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: irbis
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/irbis
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
      - irbis_uploads_dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Vite proxies /api (and /certs) to the backend service.
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata-dev:
  backend_node_modules:
  frontend_node_modules:
  irbis_uploads_dev:
