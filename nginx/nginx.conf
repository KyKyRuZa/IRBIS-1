# =========================================================
#  Глобальные настройки (обычно в /etc/nginx/nginx.conf)
#  Включаем, если эти директивы ещё не заданы там.
# =========================================================
# worker_processes auto;
# events { worker_connections 4096; }

# --- Скрыть версию nginx ---
server_tokens off;

# --- Gzip ---
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/xml+rss
    application/vnd.ms-fontobject application/x-font-ttf
    font/opentype image/svg+xml;

# --- Brotli (только если установлен модуль ngx_brotli) ---
# brotli on;
# brotli_comp_level 6;
# brotli_types
#     text/plain text/css text/xml application/json
#     application/javascript application/xml+rss
#     application/vnd.ms-fontobject application/x-font-ttf
#     font/opentype image/svg+xml;

# --- Upstream с keepalive к бэкенду ---
upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

# =====================================================
# HTTP: ACME challenge + redirect to HTTPS
# =====================================================
server {
    listen 80;
    server_name irbis.cloud-ip.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# HTTPS
# =====================================================
server {
    listen 443 ssl http2;
    server_name irbis.cloud-ip.cc;

    # --- Certificates ---
    ssl_certificate     /etc/letsencrypt/live/irbis.cloud-ip.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irbis.cloud-ip.cc/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1;

    # --- SSL session cache ---
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # --- OCSP Stapling ---
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/irbis.cloud-ip.cc/fullchain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Site ---
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # --- Security headers (единое место для всех ответов, включая статику) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # --- HSTS ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Hashed build assets: cache aggressively ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers here: nginx add_header does NOT inherit
        # from server level when a location has its own add_header directives.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API proxy ---
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # --- Uploaded files proxy (longer timeout for large uploads) ---
    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;

        # --- Опционально: кэш статики на стороне nginx ---
        # proxy_cache uploads_cache;
        # proxy_cache_valid 200 206 1h;
        # proxy_cache_key "$scheme$request_method$host$request_uri";
        # add_header X-Proxy-Cache $upstream_cache_status;
    }

    # --- Certificate files proxy ---
    location /certs/ {
        proxy_pass http://backend_upstream/certs/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
    }
}